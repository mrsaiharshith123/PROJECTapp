<!doctype html>
<html lang="en" data-ui="ct" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d17" />
    <title>Perovo Update Test</title>
    <script>
      (function () {
        var root = document.documentElement;
        root.dataset.theme = "dark";
        root.classList.add("dark");
        root.style.colorScheme = "dark";
        root.style.background = "#0d0e18";
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100dvh;
        background: inherit;
      }
    </style>
    <script>
      (function () {
        function showBootError(msg) {
          var root = document.getElementById("root");
          if (!root || root.dataset.bootError) return;
          root.dataset.bootError = "1";
          root.innerHTML =
            '<p style="padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#f0eff9;white-space:pre-wrap">' +
            msg +
            "</p>";
        }
        window.addEventListener("error", function (e) {
          showBootError("Load error: " + (e.message || "unknown"));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var reason = e.reason && (e.reason.message || String(e.reason));
          showBootError("Startup failed: " + (reason || "unknown"));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <p style="margin:0;padding:2rem 1rem;text-align:center;font-family:system-ui,sans-serif;font-size:0.9rem;color:#8b8aa3">
        Starting update test…
      </p>
    </div>
    <script type="module" src="/src/capgo-notify-update-test-only.js"></script>
    <script type="module" src="/src/main-update-test.jsx"></script>
  </body>
</html>
