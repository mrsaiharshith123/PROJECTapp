<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="brand/icon-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f3" />
    <meta name="description" content="Perovo — finance simplified. Track bills, pressure, repayments, and lending on your device." />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perovo" />
    <link rel="apple-touch-icon" href="pwa-192-light.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,0,500;9..144,0,600;9..144,0,700;9..144,0,900;9..144,1,400;9..144,1,600&family=Newsreader:opsz,ital,wght@6..72,0,400;6..72,0,500;6..72,1,400;6..72,1,500&display=swap"
      rel="stylesheet"
    />
    <title>Perovo</title>
    <script>
      (function () {
        var theme = "light";
        try {
          var raw = localStorage.getItem("perovo_settings");
          if (raw) {
            var o = JSON.parse(raw);
            if (o && o.colorScheme === "light") theme = "light";
            else if (o && o.colorScheme === "dark") theme = "dark";
            else if (!o.colorScheme || o.colorScheme === "system") {
              theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
          }
        } catch (e) {
          /* ignore */
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        var bg = theme === "dark" ? "#16140f" : "#faf8f3";
        root.style.background = bg;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#16140f" : "#faf8f3");
        var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
        if (appleIcon) appleIcon.setAttribute("href", theme === "light" ? "pwa-192-light.svg" : "pwa-192.svg");
        var favicon = document.querySelector('link[rel="icon"]');
        if (favicon) favicon.setAttribute("href", theme === "light" ? "brand/icon-light.svg" : "brand/icon-dark.svg");
      })();
      (function () {
        var h = location.hostname;
        if (h === "localhost" || h === "127.0.0.1" || h === "[::1]") {
          document.documentElement.dataset.devPhoneFrame = "1";
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100dvh;
        background: inherit;
      }
      #boot-loader {
        --boot-bg: #16140f;
        --boot-ink: #faf8f3;
        --boot-ink-faint: rgba(250, 248, 243, 0.45);
        --boot-gold: #e3c489;
        --boot-rule: rgba(250, 248, 243, 0.14);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
      }
      html[data-theme="light"] #boot-loader {
        --boot-bg: #faf8f3;
        --boot-ink: #1a1814;
        --boot-ink-faint: rgba(26, 24, 20, 0.45);
        --boot-gold: #b08642;
        --boot-rule: rgba(26, 24, 20, 0.12);
      }
      #boot-loader .boot-ed-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      #boot-loader .boot-ed-title {
        font-family: "Fraunces", Georgia, serif;
        font-size: 28px;
        font-weight: 700;
        font-style: italic;
        letter-spacing: -0.01em;
        color: var(--boot-ink);
        line-height: 1;
      }
      #boot-loader .boot-ed-tagline {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--boot-ink-faint);
        margin-top: 4px;
      }
      html[data-dev-phone-frame="1"],
      html[data-dev-phone-frame="1"] body,
      html[data-dev-phone-frame="1"] #root {
        background: #0d0d0d !important;
      }
      html[data-dev-phone-frame="1"] #boot-loader {
        display: none !important;
      }
      #boot-loader .boot-ed-progress {
        width: 60px;
        height: 2px;
        background: var(--boot-rule);
        overflow: hidden;
        margin-top: 2px;
      }
      #boot-loader .boot-ed-progress span {
        display: block;
        height: 100%;
        width: 35%;
        background: var(--boot-gold);
        animation: boot-ed-prog 1.4s ease-in-out infinite;
      }
      @keyframes boot-ed-prog {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
    <script>
      (function () {
        function showBootError(msg) {
          var root = document.getElementById("root");
          if (!root || root.dataset.bootError) return;
          root.dataset.bootError = "1";
          var ink = document.documentElement.dataset.theme === "dark" ? "#faf8f3" : "#1a1814";
          root.innerHTML =
            '<p style="padding:24px;text-align:center;font-family:system-ui,sans-serif;color:' +
            ink +
            ';white-space:pre-wrap">' +
            msg +
            "</p>";
        }
        window.addEventListener("error", function (e) {
          showBootError("Load error: " + (e.message || "unknown"));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var reason = e.reason && (e.reason.message || String(e.reason));
          showBootError("Startup failed: " + (reason || "unknown"));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-ed-inner">
          <div class="boot-ed-title">Perovo</div>
          <div class="boot-ed-tagline">Your Financial Record</div>
          <div class="boot-ed-progress" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/capgo-notify-only.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
